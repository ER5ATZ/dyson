<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="What is a Dyson Sphere?" />
    <meta property="og:description" content="Visualization of a Dyson Sphere concept with Three.js" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://er5atz.github.io/dyson/" />
    <meta property="og:image" content="https://er5atz.github.io/dyson/preview.jpg" />

    <meta name="twitter:title" content="What is a Dyson Sphere?" />
    <meta name="twitter:description" content="Visualization of a Dyson Sphere concept with Three.js" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://er5atz.github.io/dyson/preview.jpg" />

    <link rel="icon" type="image/svg+xml" href="vite.svg" />
    <title>Dyson Sphere</title>
  </head>
  <body>
    <canvas id="bg"></canvas>

    <main id="text">
    </main>
    <footer>
      <span id="settings-btn" title="Settings">⚙</span>
    </footer>
    <div id="settings-panel" class="settings-panel hidden">
      <div class="setting-row">
        <span id="text-toggle" class="setting-btn active" title="Toggle Text">&#8644;</span>
        <span id="lang-en" class="setting-btn lang-btn active" title="English">EN</span>
        <span id="lang-de" class="setting-btn lang-btn" title="Deutsch">DE</span>
        <span id="lang-ja" class="setting-btn lang-btn" title="日本語">日本</span>
      </div>
      <div class="setting-row">
        <span class="setting-label">»</span>
        <input type="range" id="speed-slider" min="0.1" max="5" step="0.1" value="1" />
        <span id="speed-value">1×</span>
      </div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
